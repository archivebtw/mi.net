<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>mi.net — talk. gather. create.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- SEGMENT 1: PRIMARY NAV -->
    <aside class="rail" aria-label="Primary navigation">
      <button class="brand" data-view="chats" aria-label="mi.net">mi</button>

      <nav class="rail-nav">
        <button class="rail-btn active" data-view="chats" aria-label="Chats">
          <span class="icon" data-icon="message"></span>
        </button>
        <button class="rail-btn" data-view="contacts" aria-label="Contacts">
          <span class="icon" data-icon="users"></span>
        </button>
        <button class="rail-btn" data-view="publics" aria-label="Publics">
          <span class="icon" data-icon="hash"></span>
        </button>
        <button class="rail-btn" data-view="explore" aria-label="Explore">
          <span class="icon" data-icon="compass"></span>
        </button>
      </nav>

      <div class="rail-bottom">
        <button class="rail-btn" id="settingsBtn" aria-label="Settings">
          <span class="icon" data-icon="settings"></span>
        </button>
        <button class="profile-orb" data-view="profile" aria-label="Profile">KD</button>
      </div>
    </aside>

    <!-- SEGMENT 2: LIST PANE -->
    <aside class="list-pane">
      <header class="list-header">
        <div class="wordmark">mi.net</div>
        <div class="header-actions">
          <button class="icon-btn" id="searchToggle" aria-label="Search">
            <span class="icon" data-icon="search"></span>
          </button>
          <button class="icon-btn" id="createMenuBtn" aria-label="Create">
            <span class="icon" data-icon="plus"></span>
          </button>
        </div>
      </header>

      <div class="search-row" id="searchRow">
        <label class="search-box">
          <span class="icon" data-icon="search"></span>
          <input id="globalSearch" type="search" placeholder="Search mi.net" />
        </label>
      </div>

      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="direct">Direct</button>
        <button class="filter-tab" data-filter="group">Groups</button>
        <button class="filter-tab" data-filter="public">Publics</button>
      </div>

      <div class="list-content" id="listContent"></div>
    </aside>

    <!-- SEGMENT 3: MAIN CONVERSATION PANE -->
    <main class="chat-pane" id="chatPane">
      <div class="empty-chat">
        <div class="empty-mark">mi.net</div>
        <h1>Your internet, without the noise.</h1>
        <p>Choose a chat, group or public to start talking.</p>
      </div>
    </main>

    <!-- SEGMENT 4: DETAILS PANE -->
    <aside class="details-pane" id="detailsPane"></aside>

  </div>

  <!-- SEGMENT 5: MOBILE TOP BAR -->
  <header class="mobile-topbar">
    <button class="icon-btn" id="mobileBackBtn" aria-label="Back">
      <span class="icon" data-icon="arrow-left"></span>
    </button>
    <div class="mobile-title" id="mobileTitle">mi.net</div>
    <button class="icon-btn" id="mobileCreateBtn" aria-label="Create">
      <span class="icon" data-icon="plus"></span>
    </button>
  </header>

  <!-- SEGMENT 6: CREATE MENU -->
  <div class="popover" id="createPopover" hidden>
    <button data-create="direct"><span class="icon" data-icon="user-plus"></span><span>New message</span></button>
    <button data-create="group"><span class="icon" data-icon="users"></span><span>New group</span></button>
    <button data-create="public"><span class="icon" data-icon="hash"></span><span>New public</span></button>
  </div>

  <!-- SEGMENT 7: CREATE PUBLIC MODAL -->
  <div class="modal-backdrop" id="publicModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="publicModalTitle">
      <header class="modal-header">
        <button class="icon-btn modal-close" aria-label="Close"><span class="icon" data-icon="x"></span></button>
        <strong id="publicModalTitle">Create a public</strong>
        <button class="compact-primary" id="createPublicSubmit">Create</button>
      </header>

      <div class="modal-body">
        <label class="field">
          <span>Name</span>
          <input id="publicName" placeholder="Design Daily" maxlength="36" />
        </label>

        <label class="field">
          <span>Address</span>
          <div class="address-field">
            <span>mi.net/</span>
            <input id="publicAddress" placeholder="designdaily" maxlength="28" />
          </div>
        </label>

        <label class="field">
          <span>Description</span>
          <textarea id="publicDescription" placeholder="What is this public about?" maxlength="160"></textarea>
        </label>

        <fieldset class="mode-field">
          <legend>Mode</legend>
          <label><input type="radio" name="publicMode" value="broadcast" /> <span><strong>Broadcast</strong><small>Only admins publish.</small></span></label>
          <label><input type="radio" name="publicMode" value="community" /> <span><strong>Community</strong><small>Everyone can talk.</small></span></label>
          <label><input type="radio" name="publicMode" value="hybrid" checked /> <span><strong>Hybrid</strong><small>Admin posts with discussions.</small></span></label>
        </fieldset>

        <fieldset class="mode-field">
          <legend>Visibility</legend>
          <label><input type="radio" name="publicVisibility" value="public" checked /> <span><strong>Public</strong><small>Anyone can discover it.</small></span></label>
          <label><input type="radio" name="publicVisibility" value="private" /> <span><strong>Private</strong><small>Invite only.</small></span></label>
        </fieldset>
      </div>
    </section>
  </div>

  <!-- SEGMENT 8: TOASTS -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
